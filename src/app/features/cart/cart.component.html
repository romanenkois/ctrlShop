<div class="wrapper">
    <div class="title">
        <p>твоя корзина</p>
    </div>

    <app-cart-list></app-cart-list>

    <div class="actions">
        @if (this.cartList() && this.cartList().items &&
        this.cartList().items.length > 0) {
        <div>
            <p>загальна сума корзини: {{ this.getTotal() }} грн.</p>
            <a routerLink="/cart"><button>замовити</button></a>
        </div>
        } @else{
        <div>
            <p>в твоїй корзині ще нічого немає</p>
            <a routerLink="/clothes"><button>перейти до одягу</button></a>
        </div>
        }
    </div>
</div>
