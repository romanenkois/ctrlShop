<div class="wrapper">
    <div class="header">
        <div class="navigation">
            <div class="links">
                <div class="logo">
                    <a routerLink="/home">
                        <p>ctrlShop</p>
                    </a>
                </div>
                <div
                class="selections"
                [class.hideSelections]="hideSelections"
                >
                    <div
                        class="clothes-button"
                        (click)="toggleClothesMenu()">
                        <p [class.clothesMenuVisibility]="clothesMenuVisibility">каталог</p>
                    </div>
                    <div class="clothes-menu"
                        [class.clothesMenuVisibility]="clothesMenuVisibility">
                        <a [routerLink]="['/clothes']" [queryParams]="{category: 'all'}"><div><p>весь одяг</p></div></a>
                        <a [routerLink]="['/clothes']" [queryParams]="{category: 'tshirt'}"><div><p>футболки</p></div></a>
                        <a [routerLink]="['/clothes']" [queryParams]="{category: 'pants'}"><div><p>штани</p></div></a>
                        <a [routerLink]="['/clothes']" [queryParams]="{category: 'scarf'}"><div><p>шарфи</p></div></a>
                        <a [routerLink]="['/clothes']" [queryParams]="{category: 'hoodie'}"><div><p>худі</p></div></a>
                        <a [routerLink]="['/clothes']" [queryParams]="{category: 'sweater'}"><div><p>светри</p></div></a>
                        <a [routerLink]="['/clothes']" [queryParams]="{category: 'accessories'}"><div><p>аксесуари</p></div></a>
                    </div>
                </div>
            </div>
        </div>

        <div class="actions">
            <div class="buttons">
                <button
                (click)="toggleCart()"

                [class.visibleCart]="cartVisibility"
                [class.hideCart]="hideCart"

                class="hideCart"
                id="nav-cart-button"
                >
                    <img src="icons/general/cart.svg">
                </button>
                <button><a routerLink="/favorites"><img src="icons/general/heart.svg"></a></button>
                <button><a routerLink="/user"><img src="icons/general/user.svg"></a></button>
            </div>

        </div>
    </div>

    @if (!hideCart) {
        <div
        class="cart-widget"
        [class.visibleCart]="cartVisibility">
            <app-cart></app-cart>
        </div>
    }
</div>
